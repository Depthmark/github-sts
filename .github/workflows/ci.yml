---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Lint, test, build, and a no-push Docker build to validate the Dockerfile.
  # Delegated to the shared Depthmark/reusable-workflows pipeline so supply-chain
  # hardening (harden-runner, pinned action SHAs, input validation) stays
  # consistent across components.
  go:
    name: Go
    uses: Depthmark/reusable-workflows/.github/workflows/ci-go.yml@b75184a59af82875f02abd547e57645ffcdcd91a # v1.0.1
    permissions:
      contents: read
    with:
      docker-build: true
