---
name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions: {}

jobs:
  ci-go:
    name: CI Gate (Go)
    uses: ./.github/workflows/ci-go.yml
    permissions:
      contents: read

  ci-schema:
    name: CI Gate (Schema)
    uses: ./.github/workflows/ci-schema.yml
    permissions:
      contents: read

  docker:
    name: Docker
    needs: [ci-go, ci-schema]
    uses: Depthmark/reusable-workflows/.github/workflows/docker-build-push.yml@b75184a59af82875f02abd547e57645ffcdcd91a # v1.0.1
    with:
      tag_name: ${{ inputs.tag_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
