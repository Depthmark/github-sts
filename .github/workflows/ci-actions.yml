---
name: CI Actions

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

concurrency:
  group: ci-actions-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: Depthmark/reusable-workflows/.github/workflows/ci-actions.yml@55c7a3dbce97a8ba6ea8ed45fc26463b1b8a1f77 # v1.2.0
    with:
      poutine-skip-rules: "github_action_from_unverified_creator_used"
    permissions:
      contents: read
