---
name: CI (Schema)

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/policy/yaml/schema_v1.json'
      - 'config/examples/*.sts.yaml'
      - 'go.mod'
      - 'policies/**'
      - '.github/workflows/ci-schema.yml'
  push:
    branches: [main]
    paths:
      - 'internal/policy/yaml/schema_v1.json'
      - 'config/examples/*.sts.yaml'
      - 'go.mod'
      - 'policies/**'
      - '.github/workflows/ci-schema.yml'
  workflow_call: {}

concurrency:
  group: ci-schema-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  schema:
    name: Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Install OPA
        run: |
          go install github.com/open-policy-agent/opa@v1.16.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate examples against schema
        run: make validate-examples

      - name: Test Rego policy
        run: make test-rego
