---
name: CI (Schema)

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/policy/yaml/schema_v1.json'
      - 'config/examples/*.sts.yaml'
      - '.github/workflows/ci-schema.yml'
  push:
    branches: [main]
    paths:
      - 'internal/policy/yaml/schema_v1.json'
      - 'config/examples/*.sts.yaml'
      - '.github/workflows/ci-schema.yml'
  workflow_call: {}

concurrency:
  group: ci-schema-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  schema:
    name: Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Validate examples against schema
        run: make validate-examples
