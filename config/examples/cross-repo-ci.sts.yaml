# Target-owned policy allowing two exact source repositories to request a
# token for repository ID 456791. Call with scope=myorg/backend.
# https://github.com/Depthmark/github-sts
issuer: https://token.actions.githubusercontent.com
claim_pattern:
  ref: 'refs/heads/.*'
audience: https://sts.example.com
github:
  sources:
    - owner_id: "123456"
      repository_id: "456789"
    - owner_id: "123456"
      repository_id: "456790"
  target:
    owner_id: "123456"
    repository_id: "456791"
permissions:
  contents: read
  pull_requests: write
