# Trust policy for an org-scoped CI identity with repository restrictions.
# https://github.com/Depthmark/github-sts
issuer: https://token.actions.githubusercontent.com
subject_pattern: 'repo:myorg/.*'
audience: https://sts.example.com
repositories:
  - frontend
  - backend
  - shared-libs
permissions:
  contents: read
  pull_requests: write
