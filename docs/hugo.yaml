baseURL: http://localhost:1313/github-sts/
locale: en-us
title: github-sts
enableRobotsTXT: true

pluralizeListTitles: false

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

disablePathToLower: true

module:
  imports:
    - path: github.com/imfing/hextra
    # Satellite documentation, imported rather than copied. Each satellite
    # repository declares a Hugo module at its root and this site mounts the
    # docs/content trees out of it; see documentation-contract.md.
    #
    # The module is the repository, not its docs/ subdirectory, so the pin is
    # the ordinary release tag (@vX.Y.Z) that release-please already creates.
    # A subdirectory module would require a docs/vX.Y.Z tag, which
    # release-please cannot produce and which degrades silently to a
    # pseudo-version when it is missing. Pin to a tag, never a branch.
    #
    # A per-language mount is required because this site sets a per-language
    # `contentDir`: a `content/en/...` mount target silently produces nothing.
    # `sites.matrix.languages` is that selector. It replaced `module.mounts.lang`,
    # which Hugo deprecated in 0.153, and it needs Hugo 0.153 or newer, so it is
    # tied to the floor in docs/.hugo-version.
    - path: github.com/Depthmark/github-sts-helm
      mounts:
        - source: docs/content/en
          target: content/integrations/helm-chart
          sites:
            matrix:
              languages: [en]
        - source: docs/content/fr
          target: content/integrations/helm-chart
          sites:
            matrix:
              languages: [fr]
    - path: github.com/Depthmark/github-sts-action
      mounts:
        - source: docs/content/en
          target: content/integrations/github-action
          sites:
            matrix:
              languages: [en]
        - source: docs/content/fr
          target: content/integrations/github-action
          sites:
            matrix:
              languages: [fr]

menu:
  main:
    - identifier: sectionGetStarted
      name: Get Started
      pageRef: /get-started
      weight: 1
    - identifier: sectionConcepts
      name: Concepts
      pageRef: /concepts
      weight: 2
    - identifier: sectionIntegrations
      name: Integrations
      pageRef: /integrations
      weight: 3
    - identifier: sectionIssuers
      name: OIDC Issuers
      pageRef: /oidc-issuers
      weight: 4
    - identifier: sectionOperations
      name: Operations
      pageRef: /operations
      weight: 5
    - identifier: sectionReference
      name: Reference
      pageRef: /reference
      weight: 6
    - identifier: sectionResources
      name: Resources
      pageRef: /resources
      weight: 7
    # Hextra renders the navbar search box only for a menu entry of type "search".
    # Without this entry the flexsearch index is built but never reachable above
    # the md breakpoint, because the only other search box lives in the
    # mobile-only sidebar drawer.
    - identifier: search
      name: Search
      weight: 8
      params:
        type: search
    - identifier: theme-toggle
      weight: 9
      params:
        type: theme-toggle
    - identifier: language-switch
      weight: 10
      params:
        type: language-switch

languages:
  en:
    label: English
    locale: en
    weight: 1
    title: github-sts
    contentDir: content/en
    params:
      description: Exchange OIDC tokens for short-lived, scoped GitHub installation tokens. No PATs. No long-lived secrets.
  fr:
    label: Français
    locale: fr
    weight: 2
    title: github-sts
    contentDir: content/fr
    params:
      description: Échangez des jetons OIDC pour des jetons d'installation GitHub temporaires et limités. Sans PAT. Sans secrets persistants.

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  # Hextra reads only `default` and `displayToggle` under params.theme.
  # Logo, footer, pagination, code copy, and search are configured in their
  # own blocks below.
  theme:
    default: system
    displayToggle: true

  editURL:
    enable: true
    base: https://github.com/Depthmark/github-sts/edit/main/docs

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      width: 240
      height: 56

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  mermaid:
    enable: true
    theme: default

  page:
    width: normal

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  highlight:
    copy:
      enable: true
